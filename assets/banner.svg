  <g fill="#475569">
    <circle cx="865" cy="96" r="2.5"/>
    <circle cx="1035" cy="128" r="2.5"/>
    <circle cx="1035" cy="170" r="2.5"/>
    <circle cx="820" cy="204" r="2.5"/>
    <circle cx="940" cy="204" r="2.5"/>
    <circle cx="1080" cy="204" r="2.5"/>
    <circle cx="820" cy="240" r="2.5"/>
    <circle cx="940" cy="240" r="2.5"/>
    <circle cx="1080" cy="240" r="2.5"/>
