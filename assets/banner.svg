    <text x="940" y="227" text-anchor="middle" fill="#E2E8F0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600">catalog</text>

    <rect x="1010" y="204" width="140" height="36" rx="9" fill="#16233D" stroke="#334155"/>
    <text x="1080" y="227" text-anchor="middle" fill="#E2E8F0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600">transactions</text>

    <rect x="925" y="264" width="170" height="32" rx="8" fill="#0F2A2A" stroke="#10B981"/>
    <text x="1010" y="285" text-anchor="middle" fill="#6EE7B7" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600">PostgreSQL 16</text>
