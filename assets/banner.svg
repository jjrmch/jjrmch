    <rect x="770" y="204" width="100" height="36" rx="9" fill="#16233D" stroke="#334155"/>
    <text x="820" y="227" text-anchor="middle" fill="#E2E8F0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600">auth</text>

